<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio of Kiranpreet Kaur, a Flutter Developer with 4+ years of experience building production-ready mobile and web applications.">
  <meta name="keywords" content="Kiranpreet Kaur, Flutter Developer, Flutter, Dart, Android, iOS, Flutter Web, Mobile App Development">
  <meta name="author" content="Kiranpreet Kaur">
  <!-- Default Flutter blue accent. See AppConstants.defaultThemeColor. -->
  <meta name="theme-color" content="#4F7CFF">

  <meta property="og:title" content="Kiranpreet Kaur | Flutter Developer">
  <meta property="og:description" content="Portfolio of Kiranpreet Kaur, a Flutter Developer with 4+ years of experience building production-ready mobile and web applications.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en">
  <!--
    Canonical URL, og:url, og:image, and twitter:image are omitted until
    SiteConfig.portfolioUrl and SiteConfig.ogImagePath are set.
    Do not publish FINAL_PORTFOLIO_URL or a missing image path.
    Expected image file: web/assets/og-image.png
  -->

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kiranpreet Kaur | Flutter Developer">
  <meta name="twitter:description" content="Portfolio of Kiranpreet Kaur, a Flutter Developer with 4+ years of experience building production-ready mobile and web applications.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kiranpreet">
  <!--
    web/favicon.png and web/icons/ are still the Flutter template icons.
    Replace those files with branded assets before deployment.
    Keep these links pointed at files that exist.
  -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>Kiranpreet Kaur | Flutter Developer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
